openapi: 3.0.3
info:
  title: Travel AI Trip Service API
  version: 1.0.0
  description: Core frontend-facing trip contract. It models existing raw response bodies while new endpoints move toward the documented envelope.
servers:
  - url: /api/trips
security: [{ BearerAuth: [] }]
tags:
  - name: Alpha
  - name: Trips
  - name: Itinerary
  - name: Generation jobs
  - name: Budget and expenses
  - name: Collaboration
  - name: Public sharing
  - name: Planning
  - name: AI datasets
  - name: AI model serving
paths:
  /alpha/waitlist:
    post:
      tags: [Alpha]
      operationId: joinAlphaWaitlist
      security: []
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/JoinAlphaWaitlistRequest' } } }
      responses:
        '201':
          description: Waitlist entry registered or refreshed.
          content: { application/json: { schema: { $ref: '#/components/schemas/AlphaWaitlistResponse' } } }
        '400': { $ref: '#/components/responses/ErrorResponse' }
        '429': { $ref: '#/components/responses/ErrorResponse' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /alpha/activate:
    post:
      tags: [Alpha]
      operationId: activateAlphaInvite
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ActivateAlphaInviteRequest' } } }
      responses:
        '200':
          description: Invite activated for the authenticated user.
          content: { application/json: { schema: { $ref: '#/components/schemas/AlphaParticipantResponse' } } }
        '400': { $ref: '#/components/responses/ErrorResponse' }
        '401': { $ref: '#/components/responses/ErrorResponse' }
        '409': { $ref: '#/components/responses/ErrorResponse' }
        '429': { $ref: '#/components/responses/ErrorResponse' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /alpha/me:
    get:
      tags: [Alpha]
      operationId: getAlphaParticipant
      responses:
        '200':
          description: Authenticated user's alpha participant metadata.
          content: { application/json: { schema: { $ref: '#/components/schemas/AlphaParticipantResponse' } } }
        '401': { $ref: '#/components/responses/ErrorResponse' }
        '404': { $ref: '#/components/responses/ErrorResponse' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /analytics/events:
    post:
      tags: [Alpha]
      operationId: recordProductAnalyticsEvent
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ProductAnalyticsEventRequest' } } }
      responses:
        '202':
          description: Privacy-safe analytics event accepted.
          content: { application/json: { schema: { $ref: '#/components/schemas/ProductAnalyticsEventResponse' } } }
        '400': { $ref: '#/components/responses/ErrorResponse' }
        '401': { $ref: '#/components/responses/ErrorResponse' }
        '429': { $ref: '#/components/responses/ErrorResponse' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /feedback:
    post:
      tags: [Alpha]
      operationId: submitAlphaFeedback
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/SubmitAlphaFeedbackRequest' } }
          multipart/form-data: { schema: { $ref: '#/components/schemas/SubmitAlphaFeedbackMultipartRequest' } }
      responses:
        '201':
          description: Structured feedback submitted.
          content: { application/json: { schema: { $ref: '#/components/schemas/AlphaFeedbackDetail' } } }
        '400': { $ref: '#/components/responses/ErrorResponse' }
        '401': { $ref: '#/components/responses/ErrorResponse' }
        '413': { $ref: '#/components/responses/ErrorResponse' }
        '429': { $ref: '#/components/responses/ErrorResponse' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /feedback/{feedbackId}:
    get:
      tags: [Alpha]
      operationId: getMyAlphaFeedback
      parameters: [{ name: feedbackId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200':
          description: Feedback detail for the submitting user.
          content: { application/json: { schema: { $ref: '#/components/schemas/AlphaFeedbackDetail' } } }
        '401': { $ref: '#/components/responses/ErrorResponse' }
        '404': { $ref: '#/components/responses/ErrorResponse' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /feature-flags/public:
    get:
      tags: [Operations]
      operationId: getPublicFeatureFlags
      security: []
      responses:
        '200':
          description: Browser-safe global boolean flags only.
          content: { application/json: { schema: { $ref: '#/components/schemas/PublicFeatureFlagsResponse' } } }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /ops/feature-flags:
    get:
      tags: [Operations]
      operationId: listOpsFeatureFlags
      responses:
        '200':
          description: Allowlisted operator view of registered flags and sources.
          content: { application/json: { schema: { $ref: '#/components/schemas/OpsFeatureFlagsResponse' } } }
        '403': { $ref: '#/components/responses/ErrorResponse' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /ops/feature-flags/{key}:
    parameters: [{ name: key, in: path, required: true, schema: { type: string } }]
    get:
      tags: [Operations]
      operationId: getOpsFeatureFlag
      responses:
        '200': { description: Resolved flag, content: { application/json: { schema: { $ref: '#/components/schemas/OpsFeatureFlag' } } } }
        '403': { $ref: '#/components/responses/ErrorResponse' }
        '404': { $ref: '#/components/responses/ErrorResponse' }
        default: { $ref: '#/components/responses/ErrorResponse' }
    patch:
      tags: [Operations]
      operationId: updateOpsFeatureFlag
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/UpdateFeatureFlagRequest' } } }
      responses:
        '200': { description: Updated resolved flag, content: { application/json: { schema: { $ref: '#/components/schemas/OpsFeatureFlag' } } } }
        '400': { $ref: '#/components/responses/ErrorResponse' }
        '403': { $ref: '#/components/responses/ErrorResponse' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /ops/feature-flags/{key}/reset:
    post:
      tags: [Operations]
      operationId: resetOpsFeatureFlag
      parameters: [{ name: key, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ResetFeatureFlagRequest' } } }
      responses:
        '200': { description: Resolved default flag, content: { application/json: { schema: { $ref: '#/components/schemas/OpsFeatureFlag' } } } }
        '403': { $ref: '#/components/responses/ErrorResponse' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /ops/feature-flags/{key}/audit:
    get:
      tags: [Operations]
      operationId: listOpsFeatureFlagAudit
      parameters: [{ name: key, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: Flag audit events, content: { application/json: { schema: { $ref: '#/components/schemas/FeatureFlagAuditResponse' } } } }
        '403': { $ref: '#/components/responses/ErrorResponse' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /ai-training/consent:
    get:
      tags: [AI datasets]
      operationId: getAITrainingConsent
      responses:
        '200':
          description: Current user's global future-example AI training consent.
          content: { application/json: { schema: { $ref: '#/components/schemas/AITrainingConsentResponse' } } }
        '401': { $ref: '#/components/responses/ErrorResponse' }
        default: { $ref: '#/components/responses/ErrorResponse' }
    put:
      tags: [AI datasets]
      operationId: updateAITrainingConsent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [granted]
              properties: { granted: { type: boolean } }
      responses:
        '200':
          description: Updated AI training consent.
          content: { application/json: { schema: { $ref: '#/components/schemas/AITrainingConsentResponse' } } }
        '401': { $ref: '#/components/responses/ErrorResponse' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /trips/{tripId}/ai-training/consent:
    post:
      tags: [AI datasets]
      operationId: grantTripAITrainingConsent
      parameters: [{ $ref: '#/components/parameters/TripId' }]
      responses:
        '200':
          description: Consent granted for a trip scope.
          content: { application/json: { schema: { $ref: '#/components/schemas/AITrainingConsentResponse' } } }
        default: { $ref: '#/components/responses/ErrorResponse' }
    delete:
      tags: [AI datasets]
      operationId: revokeTripAITrainingConsent
      parameters: [{ $ref: '#/components/parameters/TripId' }]
      responses:
        '200':
          description: Consent revoked for a trip scope.
          content: { application/json: { schema: { $ref: '#/components/schemas/AITrainingConsentResponse' } } }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /trips/{tripId}/itinerary/versions/{versionId}/ai-training/consent:
    post:
      tags: [AI datasets]
      operationId: grantItineraryVersionAITrainingConsent
      parameters: [{ $ref: '#/components/parameters/TripId' }, { $ref: '#/components/parameters/VersionId' }]
      responses:
        '200':
          description: Consent granted for one itinerary version scope.
          content: { application/json: { schema: { $ref: '#/components/schemas/AITrainingConsentResponse' } } }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /ops/ai/fine-tuning/readiness:
    get:
      tags: [AI datasets]
      operationId: getFineTuningReadiness
      responses:
        '200':
          description: Operator readiness summary; ready=false blocks training/export workflows.
          content: { application/json: { schema: { $ref: '#/components/schemas/AIDatasetReadiness' } } }
        '403': { $ref: '#/components/responses/ErrorResponse' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /ops/ai/model-deployments:
    post:
      tags: [AI model serving]
      operationId: registerAIModelDeployment
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/RegisterAIModelDeploymentRequest' } } }
      responses:
        '201':
          description: Registered deployment with traffic disabled unless explicitly supplied otherwise.
          content: { application/json: { schema: { $ref: '#/components/schemas/AIModelDeployment' } } }
        '400': { $ref: '#/components/responses/ErrorResponse' }
        '403': { $ref: '#/components/responses/ErrorResponse' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /ops/ai/model-deployments/{deploymentId}/enable-shadow:
    post:
      tags: [AI model serving]
      operationId: enableAIModelShadowRollout
      parameters: [{ name: deploymentId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/EnableAIModelShadowRequest' } } }
      responses:
        '200':
          description: Deployment moved to shadow traffic mode.
          content: { application/json: { schema: { $ref: '#/components/schemas/AIModelDeployment' } } }
        '400': { $ref: '#/components/responses/ErrorResponse' }
        '403': { $ref: '#/components/responses/ErrorResponse' }
        '404': { $ref: '#/components/responses/ErrorResponse' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /ops/ai/model-deployments/{deploymentId}/pause:
    post:
      tags: [AI model serving]
      operationId: pauseAIModelDeployment
      parameters: [{ name: deploymentId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AIModelDeploymentActionRequest' } } }
      responses:
        '200':
          description: Deployment paused and traffic disabled.
          content: { application/json: { schema: { $ref: '#/components/schemas/AIModelDeployment' } } }
        '400': { $ref: '#/components/responses/ErrorResponse' }
        '403': { $ref: '#/components/responses/ErrorResponse' }
        '404': { $ref: '#/components/responses/ErrorResponse' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /ops/ai/model-deployments/{deploymentId}/rollback:
    post:
      tags: [AI model serving]
      operationId: rollbackAIModelDeployment
      parameters: [{ name: deploymentId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AIModelDeploymentActionRequest' } } }
      responses:
        '200':
          description: Deployment retired and traffic disabled.
          content: { application/json: { schema: { $ref: '#/components/schemas/AIModelDeployment' } } }
        '400': { $ref: '#/components/responses/ErrorResponse' }
        '403': { $ref: '#/components/responses/ErrorResponse' }
        '404': { $ref: '#/components/responses/ErrorResponse' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /ops/ai/model-deployments/{deploymentId}/online-summary:
    get:
      tags: [AI model serving]
      operationId: getAIModelOnlineSummary
      parameters: [{ name: deploymentId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200':
          description: Last-24-hour online comparison aggregate for a candidate deployment.
          content: { application/json: { schema: { $ref: '#/components/schemas/AIModelOnlineSummary' } } }
        '403': { $ref: '#/components/responses/ErrorResponse' }
        '404': { $ref: '#/components/responses/ErrorResponse' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /ops/ai/datasets/projects:
    get:
      tags: [AI datasets]
      operationId: listAIDatasetProjects
      responses:
        '200':
          description: Dataset projects.
          content: { application/json: { schema: { type: object, required: [projects], properties: { projects: { type: array, items: { $ref: '#/components/schemas/AIDatasetProject' } } } } } }
        default: { $ref: '#/components/responses/ErrorResponse' }
    post:
      tags: [AI datasets]
      operationId: createAIDatasetProject
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateAIDatasetProjectRequest' } } }
      responses:
        '201':
          description: Created dataset project.
          content: { application/json: { schema: { $ref: '#/components/schemas/AIDatasetProject' } } }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /ops/ai/datasets/projects/{projectId}/extract-golden:
    post:
      tags: [AI datasets]
      operationId: extractGoldenAIDatasetExamples
      parameters: [{ name: projectId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '202': { description: Golden/eval holdout examples imported, content: { application/json: { schema: { type: object, properties: { created: { type: integer } } } } } }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /ops/ai/datasets/projects/{projectId}/extract-manual:
    post:
      tags: [AI datasets]
      operationId: extractManualAIDatasetExamples
      parameters: [{ name: projectId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '202': { description: Manual curated examples imported, content: { application/json: { schema: { type: object, properties: { created: { type: integer } } } } } }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /ops/ai/datasets/projects/{projectId}/versions:
    post:
      tags: [AI datasets]
      operationId: buildAIDatasetVersion
      parameters: [{ name: projectId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/BuildAIDatasetVersionRequest' } } }
      responses:
        '202':
          description: Dataset version built from approved, sanitized, consent-valid examples.
          content: { application/json: { schema: { $ref: '#/components/schemas/AIDatasetVersion' } } }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /ops/ai/datasets/examples:
    get:
      tags: [AI datasets]
      operationId: listAIDatasetExamples
      parameters:
        - { name: datasetProjectId, in: query, schema: { type: string, format: uuid } }
        - { name: reviewStatus, in: query, schema: { type: string } }
        - { name: sanitizationStatus, in: query, schema: { type: string } }
        - { name: qualityStatus, in: query, schema: { type: string } }
        - { name: consentStatus, in: query, schema: { type: string } }
        - { name: taskType, in: query, schema: { type: string } }
        - { name: sourceType, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0 } }
      responses:
        '200':
          description: Dataset examples for ops review.
          content: { application/json: { schema: { type: object, required: [examples], properties: { examples: { type: array, items: { $ref: '#/components/schemas/AIDatasetExample' } } } } } }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /ops/ai/datasets/examples/{exampleId}/approve:
    post:
      tags: [AI datasets]
      operationId: approveAIDatasetExample
      parameters: [{ name: exampleId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: false
        content: { application/json: { schema: { $ref: '#/components/schemas/AIDatasetReviewRequest' } } }
      responses:
        '200': { description: Approved example, content: { application/json: { schema: { $ref: '#/components/schemas/AIDatasetExample' } } } }
        '409': { $ref: '#/components/responses/ErrorResponse' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /ops/ai/datasets/examples/{exampleId}/reject:
    post:
      tags: [AI datasets]
      operationId: rejectAIDatasetExample
      parameters: [{ name: exampleId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: false
        content: { application/json: { schema: { $ref: '#/components/schemas/AIDatasetReviewRequest' } } }
      responses:
        '200': { description: Rejected example, content: { application/json: { schema: { $ref: '#/components/schemas/AIDatasetExample' } } } }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /ops/ai/datasets/versions/{versionId}/export:
    post:
      tags: [AI datasets]
      operationId: exportAIDatasetVersion
      parameters: [{ name: versionId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '202': { description: Private export package created, content: { application/json: { schema: { $ref: '#/components/schemas/AIDatasetVersion' } } } }
        '503': { $ref: '#/components/responses/ErrorResponse' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /ops/ai/datasets/versions/{versionId}/download:
    get:
      tags: [AI datasets]
      operationId: downloadAIDatasetVersion
      parameters: [{ name: versionId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200':
          description: Private ZIP stream for an exported dataset version.
          content: { application/zip: { schema: { type: string, format: binary } } }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /version:
    get:
      tags: [Operations]
      operationId: getTripServiceVersion
      security: []
      responses:
        '200':
          description: Non-sensitive service build metadata.
          content: { application/json: { schema: { $ref: '#/components/schemas/VersionMetadata' } } }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /trips:
    get:
      tags: [Trips]
      operationId: listTrips
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0 } }
        - { name: scope, in: query, schema: { type: string, enum: [personal, workspace, all] } }
        - { name: workspaceId, in: query, schema: { type: string, format: uuid, nullable: true } }
      responses:
        '200':
          description: Existing offset-paginated trip list.
          content: { application/json: { schema: { $ref: '#/components/schemas/TripsListResponse' } } }
        '401': { $ref: '#/components/responses/ErrorResponse' }
        '403': { $ref: '#/components/responses/ErrorResponse' }
        default: { $ref: '#/components/responses/ErrorResponse' }
    post:
      tags: [Trips]
      operationId: createTrip
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateTripRequest' } } }
      responses:
        '201': { $ref: '#/components/responses/TripResponse' }
        '400': { $ref: '#/components/responses/ErrorResponse' }
        '401': { $ref: '#/components/responses/ErrorResponse' }
        '403': { $ref: '#/components/responses/ErrorResponse' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /trips/{tripId}:
    get:
      tags: [Trips]
      operationId: getTrip
      parameters: [{ $ref: '#/components/parameters/TripId' }]
      responses:
        '200': { $ref: '#/components/responses/TripResponse' }
        '401': { $ref: '#/components/responses/ErrorResponse' }
        '403': { $ref: '#/components/responses/ErrorResponse' }
        '404': { $ref: '#/components/responses/ErrorResponse' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /trips/{tripId}/itinerary:
    put:
      tags: [Itinerary]
      operationId: updateTripItinerary
      parameters: [{ $ref: '#/components/parameters/TripId' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/UpdateItineraryRequest' } } }
      responses:
        '200': { $ref: '#/components/responses/TripResponse' }
        '400': { $ref: '#/components/responses/ErrorResponse' }
        '401': { $ref: '#/components/responses/ErrorResponse' }
        '403': { $ref: '#/components/responses/ErrorResponse' }
        '409': { $ref: '#/components/responses/ItineraryConflictResponse' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /trips/{tripId}/itinerary/versions:
    get:
      tags: [Itinerary]
      operationId: listItineraryVersions
      parameters:
        - $ref: '#/components/parameters/TripId'
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0 } }
      responses:
        '200':
          description: Existing offset-paginated itinerary versions.
          content: { application/json: { schema: { $ref: '#/components/schemas/ItineraryVersionsResponse' } } }
        '401': { $ref: '#/components/responses/ErrorResponse' }
        '403': { $ref: '#/components/responses/ErrorResponse' }
        '404': { $ref: '#/components/responses/ErrorResponse' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /trips/{tripId}/itinerary/versions/{versionId}:
    get:
      tags: [Itinerary]
      operationId: getItineraryVersion
      parameters: [{ $ref: '#/components/parameters/TripId' }, { $ref: '#/components/parameters/VersionId' }]
      responses:
        '200':
          description: One immutable itinerary version.
          content: { application/json: { schema: { $ref: '#/components/schemas/ItineraryVersion' } } }
        '401': { $ref: '#/components/responses/ErrorResponse' }
        '403': { $ref: '#/components/responses/ErrorResponse' }
        '404': { $ref: '#/components/responses/ErrorResponse' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /trips/{tripId}/itinerary/versions/{versionId}/restore:
    post:
      tags: [Itinerary]
      operationId: restoreItineraryVersion
      parameters: [{ $ref: '#/components/parameters/TripId' }, { $ref: '#/components/parameters/VersionId' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ExpectedRevisionRequest' } } }
      responses:
        '200': { $ref: '#/components/responses/TripResponse' }
        '401': { $ref: '#/components/responses/ErrorResponse' }
        '403': { $ref: '#/components/responses/ErrorResponse' }
        '409': { $ref: '#/components/responses/ItineraryConflictResponse' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /trips/{tripId}/generation-jobs:
    post:
      tags: [Generation jobs]
      operationId: createGenerationJob
      parameters: [{ $ref: '#/components/parameters/TripId' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateGenerationJobRequest' } } }
      responses:
        '202':
          description: Queued generation job.
