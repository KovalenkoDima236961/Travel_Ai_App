        '403': { $ref: '#/components/responses/ErrorResponse' }
        default: { $ref: '#/components/responses/ErrorResponse' }
components:
  securitySchemes:
    BearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    TripId: { name: tripId, in: path, required: true, schema: { type: string, format: uuid } }
    VersionId: { name: versionId, in: path, required: true, schema: { type: string, format: uuid } }
    JobId: { name: jobId, in: path, required: true, schema: { type: string, format: uuid } }
    ExpenseId: { name: expenseId, in: path, required: true, schema: { type: string, format: uuid } }
    SettlementId: { name: settlementId, in: path, required: true, schema: { type: string, format: uuid } }
    ShareToken: { name: shareToken, in: path, required: true, schema: { type: string, minLength: 1 } }
  schemas:
    VersionMetadata:
      type: object
      required: [service, version, gitSha, buildTime, environment, apiContractVersion]
      properties:
        service: { type: string }
        version: { type: string }
        gitSha: { type: string }
        buildTime: { type: string }
        environment: { type: string }
        apiContractVersion: { type: string }
    AITrainingConsentResponse:
      type: object
      required: [status, granted, consentVersion, excludedData]
      properties:
        status: { type: string, enum: [not_granted, granted, revoked] }
        granted: { type: boolean }
        consentVersion: { type: string }
        excludedData: { type: array, items: { type: string } }
        record: { type: object, nullable: true, additionalProperties: true }
    AIDatasetProject:
      type: object
      required: [id, key, name, taskType, schemaVersion, status, minimumQualityScore, consentRequired, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        key: { type: string }
        name: { type: string }
        description: { type: string, nullable: true }
        taskType: { $ref: '#/components/schemas/AIDatasetTaskType' }
        schemaVersion: { type: string }
        status: { type: string, enum: [draft, active, frozen, archived] }
        minimumQualityScore: { type: number, minimum: 0, maximum: 1 }
        consentRequired: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CreateAIDatasetProjectRequest:
      type: object
      required: [key, name, taskType]
      properties:
        key: { type: string, minLength: 1 }
        name: { type: string, minLength: 1 }
        description: { type: string, nullable: true }
        taskType: { $ref: '#/components/schemas/AIDatasetTaskType' }
        schemaVersion: { type: string }
